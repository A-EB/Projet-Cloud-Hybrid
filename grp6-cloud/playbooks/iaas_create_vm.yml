- name: Proxmox IaaS - create a VM
  hosts: localhost
  gather_facts: false
  vars:
    vm_size: small
    vm_os: linux
    vm_password: ""
    tf_dir: "{{ playbook_dir }}/../terraform/iaas"
  tasks:
    - name: Reset the selected workspace
      file: { path: "{{ tf_dir }}/.terraform/environment", state: absent }

    - name: Terraform init
      command: terraform init -input=false -no-color
      args: { chdir: "{{ tf_dir }}" }

    - name: Workspace dedicated to this VM
      command: terraform workspace select -or-create -no-color vm-{{ vm_name }}
      args: { chdir: "{{ tf_dir }}" }

    - name: Terraform apply
      command: >
        terraform apply -auto-approve -input=false -no-color
        -var=name={{ vm_name }} -var=size={{ vm_size }} -var=ip={{ vm_ip }} -var=os={{ vm_os }}
      args: { chdir: "{{ tf_dir }}" }
      environment: { TF_VAR_admin_password: "{{ vm_password }}" }
      register: tf

    - debug: { var: "tf.stdout_lines[-3:]" }
